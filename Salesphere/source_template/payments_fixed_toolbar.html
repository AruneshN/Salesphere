
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,system-ui);font-size:13px;color:var(--color-text-primary)}
.wrap{padding:1rem 0}

/* ── TOOLBAR: single row, no wrap ── */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:nowrap;width:100%}
.sb{position:relative;flex:1 1 160px;min-width:0}
.sb i{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--color-text-secondary);pointer-events:none}
.sb input{width:100%;padding:7px 10px 7px 30px;border:0.5px solid var(--color-border-tertiary);border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px;outline:none;height:32px}
.sb input:focus{border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,0.12)}
.sb input::placeholder{color:var(--color-text-secondary);opacity:0.7}

/* ── CUSTOMER DROPDOWN ── */
.cust-wrap{position:relative;flex:0 0 auto}
.cust-btn{display:flex;align-items:center;gap:5px;padding:0 10px;border:0.5px solid var(--color-border-tertiary);border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px;cursor:pointer;height:32px;white-space:nowrap;min-width:130px;max-width:160px;justify-content:space-between}
.cust-btn:hover{border-color:var(--color-border-secondary)}
.cust-btn.active{border-color:#378ADD;background:#E6F1FB;color:#0C447C}
.cust-lft{display:flex;align-items:center;gap:4px;overflow:hidden;min-width:0}
.cust-lft span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.cust-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;width:230px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:10px;z-index:200;overflow:hidden}
.cust-panel.open{display:block}
.cp-srch{padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);position:relative}
.cp-srch i{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--color-text-secondary);pointer-events:none}
.cp-srch input{width:100%;padding:5px 8px 5px 26px;border:0.5px solid var(--color-border-tertiary);border-radius:7px;background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px;outline:none}
.cp-srch input:focus{border-color:#378ADD}
.cp-list{max-height:190px;overflow-y:auto}
.cp-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:12px}
.cp-item:hover{background:var(--color-background-secondary)}
.cp-item.sel{background:#E6F1FB;color:#0C447C}
.cp-av{width:22px;height:22px;border-radius:50%;background:#E6F1FB;color:#0C447C;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;flex-shrink:0}
.cp-item.sel .cp-av{background:#B5D4F4;color:#042C53}
.cp-ci{flex:1;min-width:0}
.cp-cn{font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-ct{font-size:10px;color:var(--color-text-secondary)}
.cp-foot{border-top:0.5px solid var(--color-border-tertiary);padding:6px 12px}
.cp-clr{font-size:11px;color:#378ADD;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.cp-clr:hover{text-decoration:underline}
.cp-none{padding:10px 12px;font-size:12px;color:var(--color-text-secondary);text-align:center}

/* ── SELECTS (status + per-page) ── */
.flt{flex:0 0 auto;padding:0 8px;border:0.5px solid var(--color-border-tertiary);border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px;outline:none;cursor:pointer;height:32px}
.flt:focus{border-color:#378ADD}
#sflt{min-width:110px}
#ppflt{min-width:80px}

/* ── ACTIVE CHIPS ── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-height:0}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;background:#E6F1FB;border:0.5px solid #B5D4F4;font-size:11px;color:#0C447C}
.fchip button{background:none;border:none;cursor:pointer;color:#378ADD;padding:0;line-height:1;display:flex;align-items:center}
.fchip button:hover{color:#0C447C}

/* ── TABLE ── */
.tbl-outer{border:0.5px solid var(--color-border-tertiary);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead tr{background:var(--color-background-secondary)}
th{padding:8px 10px;text-align:left;font-size:10px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.6px;border-bottom:0.5px solid var(--color-border-tertiary);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--color-text-primary)}
th .si{margin-left:2px;opacity:0.4;font-size:9px}
tbody tr{border-bottom:0.5px solid var(--color-border-tertiary)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover td{background:var(--color-background-secondary)}
td{padding:9px 10px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-pill{font-family:monospace;font-size:11px;color:#0C447C;background:#E6F1FB;padding:2px 6px;border-radius:4px;border:0.5px solid #B5D4F4;display:inline-block}
.cname{font-weight:500;font-size:12px}
.ctype{font-size:10px;color:var(--color-text-secondary);margin-top:1px}
.mono{font-family:monospace;font-size:12px}
.red-mono{font-family:monospace;font-size:12px;color:#A32D2D}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500}
.badge::before{content:'';width:4px;height:4px;border-radius:50%;display:block;flex-shrink:0}
.b-paid{background:#EAF3DE;color:#27500A}.b-paid::before{background:#639922}
.b-partial{background:#FAEEDA;color:#633806}.b-partial::before{background:#BA7517}
.b-pending{background:#E6F1FB;color:#0C447C}.b-pending::before{background:#378ADD}
.b-overdue{background:#FCEBEB;color:#791F1F}.b-overdue::before{background:#E24B4A}
.prog-wrap{width:36px;height:3px;background:var(--color-border-tertiary);border-radius:2px;display:inline-block;vertical-align:middle;margin-left:4px}
.prog-bar{height:3px;border-radius:2px}
.due-ok{color:var(--color-text-secondary);font-size:11px}
.due-warn{color:#854F0B;font-size:11px;font-weight:500}
.due-over{color:#A32D2D;font-size:11px;font-weight:500}

/* ── COLLECT CELL ── */
.cc-wrap{display:flex;align-items:center;gap:4px}
.amt-inp{width:76px;padding:5px 7px;border:0.5px solid var(--color-border-tertiary);border-radius:7px;background:var(--color-background-secondary);color:var(--color-text-primary);font-family:monospace;font-size:12px;outline:none;text-align:right;flex-shrink:0;height:28px}
.amt-inp:focus{border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,0.1)}
.amt-inp.full{border-color:#639922;background:#EAF3DE;color:#27500A}
.amt-inp.over{border-color:#E24B4A;background:#FCEBEB;color:#A32D2D}
.m-sel{padding:0 5px;border:0.5px solid var(--color-border-tertiary);border-radius:7px;background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:11px;outline:none;cursor:pointer;height:28px;flex-shrink:0;max-width:72px}
.prev-tag{font-size:10px;font-weight:500;padding:2px 6px;border-radius:20px;white-space:nowrap;display:none;align-items:center;gap:2px;flex-shrink:0}
.prev-tag.show{display:inline-flex}
.prev-tag.sp-paid{background:#EAF3DE;color:#27500A}
.prev-tag.sp-partial{background:#FAEEDA;color:#633806}
.cbtn{padding:0 9px;border-radius:7px;border:none;background:#378ADD;color:#fff;font-size:11px;font-weight:500;cursor:pointer;height:28px;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:3px}
.cbtn:hover{background:#185FA5}
.cbtn:disabled{opacity:0.35;cursor:default}
.closed-msg{font-size:11px;color:var(--color-text-secondary);display:flex;align-items:center;gap:4px}

/* settled */
.sc-wrap{display:flex;align-items:center;gap:6px}
.sc-info{flex:1;min-width:0}
.sc-amt{font-family:monospace;font-size:12px;color:#27500A;font-weight:500}
.sc-meta{font-size:10px;color:var(--color-text-secondary);display:flex;gap:4px;align-items:center;margin-top:1px}
.m-tag{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:3px;padding:1px 5px;font-size:10px;color:var(--color-text-secondary)}
.act-btns{display:flex;gap:3px;flex-shrink:0}
.ibtn{width:24px;height:24px;border-radius:6px;border:0.5px solid var(--color-border-tertiary);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-secondary)}
.ibtn i{font-size:13px}
.ibtn.ie:hover{border-color:#B5D4F4;background:#E6F1FB;color:#0C447C}
.ibtn.iu:hover{border-color:#F7C1C1;background:#FCEBEB;color:#A32D2D}

/* edit */
.ec-wrap{display:flex;align-items:center;gap:4px}
.edit-inp{width:76px;padding:5px 7px;border:1.5px solid #378ADD;border-radius:7px;background:var(--color-background-primary);color:var(--color-text-primary);font-family:monospace;font-size:12px;outline:none;text-align:right;height:28px}
.em-sel{padding:0 5px;border:0.5px solid var(--color-border-tertiary);border-radius:7px;background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:11px;outline:none;cursor:pointer;height:28px;flex-shrink:0;max-width:72px}
.sv-btn{padding:0 9px;border-radius:7px;border:none;background:#378ADD;color:#fff;font-size:11px;font-weight:500;cursor:pointer;height:28px}
.sv-btn:hover{background:#185FA5}
.cn-btn{padding:0 7px;border-radius:7px;border:0.5px solid var(--color-border-tertiary);background:transparent;color:var(--color-text-secondary);font-size:11px;cursor:pointer;height:28px}

/* ── FOOTER ── */
.tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);font-size:11px;color:var(--color-text-secondary)}
.pag{display:flex;gap:3px}
.pb{min-width:26px;height:26px;padding:0 5px;border-radius:6px;border:0.5px solid var(--color-border-tertiary);background:transparent;color:var(--color-text-primary);font-size:11px;cursor:pointer}
.pb:hover:not(:disabled):not(.active){background:var(--color-background-secondary)}
.pb:disabled{opacity:0.35;cursor:default}
.pb.active{background:#378ADD;border-color:#378ADD;color:#fff}
.empty-row td{text-align:center;padding:28px;color:var(--color-text-secondary);font-size:12px}
</style>

<h2 class="sr-only">Payments table with inline toolbar filters</h2>
<div class="wrap">

  <div class="toolbar">
    <div class="sb">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" id="srch" placeholder="Search invoice or customer…" oninput="render()">
    </div>

    <div class="cust-wrap" id="cWrap">
      <button class="cust-btn" id="cBtn" onclick="toggleCP()" aria-haspopup="listbox" aria-expanded="false">
        <span class="cust-lft">
          <i class="ti ti-user" style="font-size:12px;flex-shrink:0" aria-hidden="true"></i>
          <span id="cLbl">All customers</span>
        </span>
        <i class="ti ti-chevron-down" style="font-size:11px;flex-shrink:0" aria-hidden="true"></i>
      </button>
      <div class="cust-panel" id="cPanel" role="listbox">
        <div class="cp-srch">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="text" id="cpQ" placeholder="Search…" oninput="buildCP()" autocomplete="off">
        </div>
        <div class="cp-list" id="cpList"></div>
        <div class="cp-foot">
          <button class="cp-clr" onclick="clearC()">Clear filter</button>
        </div>
      </div>
    </div>

    <select class="flt" id="sflt" onchange="render()">
      <option value="">All statuses</option>
      <option value="Pending">Pending</option>
      <option value="Partial">Partial</option>
      <option value="Overdue">Overdue</option>
      <option value="Paid">Paid</option>
    </select>

    <select class="flt" id="ppflt" onchange="ppCh()">
      <option value="6">6 / page</option>
      <option value="10">10 / page</option>
    </select>
  </div>

  <div id="chips" class="chips" style="display:none"></div>

  <div class="tbl-outer">
    <table>
      <thead><tr>
        <th style="width:96px" onclick="srt('inv')">Invoice <span class="si" id="ss-inv">↕</span></th>
        <th style="width:148px" onclick="srt('cust')">Customer <span class="si" id="ss-cust">↕</span></th>
        <th style="width:80px" onclick="srt('due')">Due <span class="si" id="ss-due">↕</span></th>
        <th style="width:90px" onclick="srt('total')">Total <span class="si" id="ss-total">↕</span></th>
        <th style="width:84px" onclick="srt('bal')">Balance <span class="si" id="ss-bal">↕</span></th>
        <th style="width:72px">Status</th>
        <th>Collect payment</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="tbl-foot">
      <span id="pgInfo"></span>
      <div class="pag" id="pagDiv"></div>
    </div>
  </div>
</div>

<script>
const today=new Date('2026-05-27');
const METHODS=['Cash','UPI','Card','Bank transfer','Cheque'];
let data=[
  {id:1,inv:'#SS-1031',cust:'Ravi Kumar',type:'Retail',due:'2026-05-20',total:5000,paid:0,settled:null,sMethod:'Cash',sNote:'',editing:false},
  {id:2,inv:'#SS-1030',cust:'Meena Textiles',type:'Business',due:'2026-05-15',total:8750,paid:3500,settled:null,sMethod:'UPI',sNote:'',editing:false},
  {id:3,inv:'#SS-1029',cust:'Anand Stores',type:'Wholesale',due:'2026-06-01',total:560,paid:560,settled:null,sMethod:'Cash',sNote:'',editing:false},
  {id:4,inv:'#SS-1028',cust:'Kavitha Electronics',type:'Business',due:'2026-04-30',total:12400,paid:5000,settled:null,sMethod:'Bank transfer',sNote:'',editing:false},
  {id:5,inv:'#SS-1027',cust:'Selvam Traders',type:'Wholesale',due:'2026-04-25',total:1890,paid:0,settled:null,sMethod:'Cash',sNote:'',editing:false},
  {id:6,inv:'#SS-1026',cust:'Priya Fashions',type:'Retail',due:'2026-05-28',total:3200,paid:1600,settled:null,sMethod:'Card',sNote:'',editing:false},
  {id:7,inv:'#SS-1025',cust:'Kumar Hardware',type:'Business',due:'2026-05-10',total:7450,paid:0,settled:null,sMethod:'Cheque',sNote:'',editing:false},
  {id:8,inv:'#SS-1024',cust:'Nair Distributors',type:'Wholesale',due:'2026-06-05',total:15200,paid:15200,settled:null,sMethod:'UPI',sNote:'',editing:false},
  {id:9,inv:'#SS-1023',cust:'Lakshmi Stores',type:'Retail',due:'2026-04-18',total:920,paid:0,settled:null,sMethod:'Cash',sNote:'',editing:false},
  {id:10,inv:'#SS-1022',cust:'Sri Balaji Traders',type:'Business',due:'2026-05-30',total:4600,paid:2000,settled:null,sMethod:'UPI',sNote:'',editing:false},
];
const custs=[...new Map(data.map(d=>[d.cust,{name:d.cust,type:d.type}])).values()];
let selC='',sk='due',sa=true,pg=1,pp=6;

function ini(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function calcS(inv){
  if(inv.paid>=inv.total)return 'Paid';
  if(inv.paid>0)return 'Partial';
  if(new Date(inv.due)<today)return 'Overdue';
  return 'Pending';
}
function dueL(s){
  const d=new Date(s),diff=Math.round((d-today)/86400000);
  if(diff<0)return{t:Math.abs(diff)+'d overdue',c:'due-over'};
  if(diff===0)return{t:'Due today',c:'due-warn'};
  if(diff<=7)return{t:'In '+diff+'d',c:'due-warn'};
  return{t:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}),c:'due-ok'};
}
function fmt(n){return '₹'+Math.round(n).toLocaleString('en-IN')}
function bCls(s){return s==='Paid'?'b-paid':s==='Partial'?'b-partial':s==='Overdue'?'b-overdue':'b-pending'}
function mOpts(sel){return METHODS.map(m=>`<option value="${m}"${m===sel?' selected':''}>${m}</option>`).join('')}
function mIco(m){return m==='Cash'?'cash':m==='UPI'?'device-mobile':m==='Card'?'credit-card':m==='Bank transfer'?'building-bank':'receipt-2'}

function buildCP(){
  const q=(document.getElementById('cpQ').value||'').toLowerCase();
  const list=q?custs.filter(c=>c.name.toLowerCase().includes(q)):custs;
  const el=document.getElementById('cpList');
  if(!list.length){el.innerHTML='<div class="cp-none">No customers found</div>';return;}
  el.innerHTML=list.map(c=>`
    <div class="cp-item${selC===c.name?' sel':''}" onclick="selCust('${c.name.replace(/'/,"\\'")}')">
      <div class="cp-av">${ini(c.name)}</div>
      <div class="cp-ci"><div class="cp-cn">${c.name}</div><div class="cp-ct">${c.type}</div></div>
      ${selC===c.name?'<i class="ti ti-check" style="font-size:12px;color:#378ADD;flex-shrink:0"></i>':''}
    </div>`).join('');
}
function toggleCP(){
  const p=document.getElementById('cPanel'),b=document.getElementById('cBtn');
  const open=p.classList.toggle('open');
  b.setAttribute('aria-expanded',open);
  if(open){buildCP();setTimeout(()=>document.getElementById('cpQ').focus(),40);}
}
function selCust(n){
  selC=selC===n?'':n;
  updateCBtn();buildCP();pg=1;render();renderChips();
}
function clearC(){
  selC='';
  document.getElementById('cpQ').value='';
  updateCBtn();buildCP();pg=1;render();renderChips();
  document.getElementById('cPanel').classList.remove('open');
  document.getElementById('cBtn').setAttribute('aria-expanded','false');
}
function updateCBtn(){
  document.getElementById('cLbl').textContent=selC||'All customers';
  document.getElementById('cBtn').classList.toggle('active',!!selC);
}
function renderChips(){
  const sf=document.getElementById('sflt').value;
  let h='';
  if(selC) h+=`<span class="fchip"><i class="ti ti-user" style="font-size:11px" aria-hidden="true"></i>${selC}<button onclick="clearC()" aria-label="Remove"><i class="ti ti-x" style="font-size:11px"></i></button></span>`;
  if(sf) h+=`<span class="fchip">${sf}<button onclick="document.getElementById('sflt').value='';render();renderChips()" aria-label="Remove"><i class="ti ti-x" style="font-size:11px"></i></button></span>`;
  const el=document.getElementById('chips');
  el.innerHTML=h;el.style.display=h?'flex':'none';
}
document.addEventListener('click',e=>{
  if(!document.getElementById('cWrap').contains(e.target)){
    document.getElementById('cPanel').classList.remove('open');
    document.getElementById('cBtn').setAttribute('aria-expanded','false');
  }
});

function filtered(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const sf=document.getElementById('sflt').value;
  return data.filter(i=>
    (!q||i.inv.toLowerCase().includes(q)||i.cust.toLowerCase().includes(q))&&
    (!selC||i.cust===selC)&&
    (!sf||calcS(i)===sf)
  ).sort((a,b)=>{
    let va,vb;
    if(sk==='bal'){va=a.total-a.paid;vb=b.total-b.paid;}
    else if(sk==='due'){va=a.due;vb=b.due;}
    else if(sk==='total'){va=a.total;vb=b.total;}
    else{va=a[sk==='inv'?'inv':'cust'];vb=b[sk==='inv'?'inv':'cust'];}
    if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}
    return sa?(va>vb?1:-1):(va<vb?1:-1);
  });
}

function ccCell(inv){
  const s=calcS(inv),bal=inv.total-inv.paid;
  if(s==='Paid') return`<td><span class="closed-msg"><i class="ti ti-circle-check" style="font-size:14px;color:#3B6D11" aria-hidden="true"></i> Closed</span></td>`;
  if(inv.settled!==null&&!inv.editing) return`<td><div class="sc-wrap">
    <i class="ti ti-circle-check" style="font-size:15px;color:#3B6D11;flex-shrink:0" aria-hidden="true"></i>
    <div class="sc-info">
      <div class="sc-amt">${fmt(inv.settled)} collected</div>
      <div class="sc-meta"><span class="m-tag"><i class="ti ti-${mIco(inv.sMethod)}" style="font-size:11px;margin-right:2px" aria-hidden="true"></i>${inv.sMethod}</span>${inv.sNote?`<span style="font-size:10px;max-width:60px;overflow:hidden;text-overflow:ellipsis" title="${inv.sNote}">${inv.sNote}</span>`:''}</div>
    </div>
    <div class="act-btns">
      <button class="ibtn ie" title="Edit" aria-label="Edit" onclick="stEdit(${inv.id})"><i class="ti ti-edit"></i></button>
      <button class="ibtn iu" title="Undo" aria-label="Undo" onclick="undoS(${inv.id})"><i class="ti ti-arrow-back-up"></i></button>
    </div>
  </div></td>`;
  if(inv.editing) return`<td><div class="ec-wrap">
    <input class="edit-inp" type="number" id="ei-${inv.id}" value="${inv.settled||''}" min="1" max="${inv.total}" step="1" placeholder="${Math.round(bal)}" onkeydown="if(event.key==='Enter')svEdit(${inv.id},${inv.total})">
    <select class="em-sel" id="em-${inv.id}">${mOpts(inv.sMethod)}</select>
    <button class="sv-btn" onclick="svEdit(${inv.id},${inv.total})">Save</button>
    <button class="cn-btn" onclick="cnEdit(${inv.id})">×</button>
  </div></td>`;
  return`<td><div class="cc-wrap">
    <input class="amt-inp" type="number" id="ai-${inv.id}" placeholder="${Math.round(bal)}" min="1" max="${bal}" step="1"
      oninput="onA(${inv.id},${bal})" onkeydown="if(event.key==='Enter')doS(${inv.id},${bal})" aria-label="Amount">
    <select class="m-sel" id="ms-${inv.id}" aria-label="Method">${mOpts('Cash')}</select>
    <span class="prev-tag" id="pt-${inv.id}"></span>
    <button class="cbtn" id="cb-${inv.id}" onclick="doS(${inv.id},${bal})" disabled>
      <i class="ti ti-check" style="font-size:11px" aria-hidden="true"></i> Confirm
    </button>
  </div></td>`;
}

function render(){
  renderChips();
  const list=filtered(),tot=list.length;
  const pages=Math.max(1,Math.ceil(tot/pp));
  if(pg>pages)pg=pages;
  const slice=list.slice((pg-1)*pp,pg*pp);
  if(!slice.length){
    document.getElementById('tbody').innerHTML=`<tr class="empty-row"><td colspan="7">No invoices match the filters</td></tr>`;
  } else {
    document.getElementById('tbody').innerHTML=slice.map(inv=>{
      const s=calcS(inv),bal=inv.total-inv.paid;
      const pct=Math.round((inv.paid/inv.total)*100);
      const bc=pct===100?'#639922':pct>0?'#BA7517':'#B5D4F4';
      const dl=dueL(inv.due);
      return`<tr id="tr-${inv.id}">
        <td><span class="inv-pill">${inv.inv}</span></td>
        <td><div style="display:flex;align-items:center;gap:7px">
          <div style="width:22px;height:22px;border-radius:50%;background:#E6F1FB;color:#0C447C;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;flex-shrink:0">${ini(inv.cust)}</div>
          <div><div class="cname">${inv.cust}</div><div class="ctype">${inv.type}</div></div>
        </div></td>
        <td><span class="${dl.c}">${dl.t}</span></td>
        <td><span class="mono">${fmt(inv.total)}<span class="prog-wrap"><span class="prog-bar" style="width:${pct}%;background:${bc}"></span></span></span></td>
        <td><span class="${bal>0&&s!=='Paid'?'red-mono':'mono'}">${fmt(bal)}</span></td>
        <td><span class="badge ${bCls(s)}">${s}</span></td>
        ${ccCell(inv)}
      </tr>`;
    }).join('');
  }
  const start=tot===0?0:(pg-1)*pp+1;
  document.getElementById('pgInfo').textContent=`Showing ${start}–${Math.min(pg*pp,tot)} of ${tot}`;
  let btns=`<button class="pb" onclick="gp(${pg-1})" ${pg===1?'disabled':''}>‹</button>`;
  for(let p=1;p<=pages;p++) btns+=`<button class="pb${p===pg?' active':''}" onclick="gp(${p})">${p}</button>`;
  btns+=`<button class="pb" onclick="gp(${pg+1})" ${pg===pages?'disabled':''}>›</button>`;
  document.getElementById('pagDiv').innerHTML=btns;
  ['inv','cust','due','total','bal'].forEach(k=>{
    const el=document.getElementById('ss-'+k);
    if(el) el.textContent=sk===k?(sa?'↑':'↓'):'↕';
  });
}
function onA(id,bal){
  const inp=document.getElementById('ai-'+id);
  const btn=document.getElementById('cb-'+id);
  const sp=document.getElementById('pt-'+id);
  const val=parseFloat(inp.value)||0;
  inp.className='amt-inp';sp.className='prev-tag';sp.textContent='';btn.disabled=true;
  if(val<=0||val>bal){if(val>bal)inp.className='amt-inp over';return;}
  btn.disabled=false;
  if(val===bal){inp.className='amt-inp full';sp.className='prev-tag show sp-paid';sp.innerHTML='<i class="ti ti-check" style="font-size:10px" aria-hidden="true"></i> Full';}
  else{sp.className='prev-tag show sp-partial';sp.textContent='Partial';}
}
function doS(id,bal){
  const inp=document.getElementById('ai-'+id);
  const val=parseFloat(inp.value)||0;
  if(val<=0||val>bal)return;
  const inv=data.find(i=>i.id===id);if(!inv)return;
  inv.paid=Math.min(inv.paid+val,inv.total);
  inv.settled=val;
  inv.sMethod=document.getElementById('ms-'+id)?.value||'Cash';
  inv.editing=false;render();
}
function stEdit(id){
  data.forEach(i=>{if(i.id!==id)i.editing=false;});
  const inv=data.find(i=>i.id===id);if(!inv)return;
  inv.editing=true;render();
  setTimeout(()=>{const el=document.getElementById('ei-'+id);if(el){el.focus();el.select();}},30);
}
function svEdit(id,tot){
  const inp=document.getElementById('ei-'+id);
  const v=parseFloat(inp.value)||0;
  const inv=data.find(i=>i.id===id);if(!inv)return;
  if(v<=0||v>tot){inp.style.borderColor='#E24B4A';return;}
  inv.paid=Math.min(inv.paid-(inv.settled||0)+v,tot);
  inv.settled=v;
  inv.sMethod=document.getElementById('em-'+id)?.value||inv.sMethod;
  inv.editing=false;render();
}
function cnEdit(id){const inv=data.find(i=>i.id===id);if(inv){inv.editing=false;render();}}
function undoS(id){
  const inv=data.find(i=>i.id===id);if(!inv)return;
  inv.paid=Math.max(0,inv.paid-(inv.settled||0));
  inv.settled=null;inv.editing=false;render();
}
function srt(k){if(sk===k)sa=!sa;else{sk=k;sa=true;}pg=1;render();}
function gp(p){pg=p;render();}
function ppCh(){pp=parseInt(document.getElementById('ppflt').value);pg=1;render();}
render();
</script>

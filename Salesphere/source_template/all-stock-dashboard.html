<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaleSphere — Stock Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #171b26;
    --surface2: #1e2332;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #8b91a8;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,0.12);
    --red: #f4617f;
    --red-dim: rgba(244,97,127,0.12);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.12);
    --green: #3ecf8e;
    --green-dim: rgba(62,207,142,0.12);
    --radius: 10px;
    --radius-lg: 14px;
  }

  html { font-size: 15px; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ── Main ── */
  .main {
    margin-left: 0;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 40;
  }
  .topbar-left h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .topbar-left p { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .topbar-right { display: flex; gap: 10px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: var(--radius);
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border2);
    background: var(--surface2); color: var(--text);
    transition: all 0.15s;
  }
  .btn:hover { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.05); }
  .btn-primary {
    background: var(--accent); color: #fff; border-color: transparent;
  }
  .btn-primary:hover { background: #6a9ef9; }
  .btn svg { width: 15px; height: 15px; }

  /* ── Content ── */
  .content { padding: 1.75rem 2rem; flex: 1; }

  /* ── Stats ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 1.75rem;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.25rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: var(--border2); }
  .stat-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }
  .stat-card.c-blue::before { background: var(--accent); }
  .stat-card.c-red::before { background: var(--red); }
  .stat-card.c-amber::before { background: var(--amber); }
  .stat-card.c-green::before { background: var(--green); }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 600; letter-spacing: -1px; font-family: 'DM Mono', monospace; }
  .stat-card.c-red .stat-value { color: var(--red); }
  .stat-card.c-amber .stat-value { color: var(--amber); }
  .stat-card.c-green .stat-value { color: var(--green); }
  .stat-card.c-blue .stat-value { color: var(--accent); }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ── Table card ── */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .table-toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative; flex: 1; min-width: 200px;
  }
  .search-wrap svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--muted); pointer-events: none;
  }
  .search-wrap input {
    width: 100%; padding: 7px 10px 7px 34px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: var(--radius); color: var(--text);
    font-family: inherit; font-size: 13px;
    outline: none; transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }

  select.filter {
    padding: 7px 10px; background: var(--surface2);
    border: 1px solid var(--border2); border-radius: var(--radius);
    color: var(--text); font-family: inherit; font-size: 13px;
    cursor: pointer; outline: none;
  }
  select.filter:focus { border-color: var(--accent); }

  /* ── Table ── */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid var(--border); }
  th {
    padding: 10px 14px; text-align: left; font-size: 11px;
    font-weight: 500; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.7px;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th .sort-icon { opacity: 0.4; margin-left: 4px; font-size: 10px; }
  th.active .sort-icon { opacity: 1; color: var(--accent); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  td { padding: 11px 14px; font-size: 13px; white-space: nowrap; }

  .sku {
    font-family: 'DM Mono', monospace; font-size: 11px;
    color: var(--muted); background: var(--surface2);
    padding: 3px 7px; border-radius: 5px;
    border: 1px solid var(--border);
  }
  .product-name { font-weight: 500; color: var(--text); }
  .product-cat { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .qty-val { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 14px; }
  .qty-red { color: var(--red); }
  .qty-amber { color: var(--amber); }
  .qty-green { color: var(--green); }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; display: block; }
  .badge-critical { background: var(--red-dim); color: var(--red); }
  .badge-critical::before { background: var(--red); box-shadow: 0 0 4px var(--red); }
  .badge-warning { background: var(--amber-dim); color: var(--amber); }
  .badge-warning::before { background: var(--amber); }
  .badge-ok { background: var(--green-dim); color: var(--green); }
  .badge-ok::before { background: var(--green); }

  .price { font-family: 'DM Mono', monospace; font-size: 13px; }

  .action-cell { display: flex; gap: 6px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid var(--border2); background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .icon-btn.danger:hover { border-color: var(--red); background: var(--red-dim); color: var(--red); }
  .icon-btn.edit:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* ── Pagination ── */
  .pagination {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 1.25rem;
    border-top: 1px solid var(--border);
    font-size: 13px; color: var(--muted);
  }
  .pag-btns { display: flex; gap: 5px; }
  .pag-btn {
    min-width: 30px; height: 30px; padding: 0 8px;
    border-radius: 7px; border: 1px solid var(--border2);
    background: transparent; color: var(--text);
    font-family: inherit; font-size: 13px;
    cursor: pointer; transition: all 0.15s;
  }
  .pag-btn:hover:not(:disabled) { border-color: rgba(255,255,255,0.22); background: var(--surface2); }
  .pag-btn:disabled { opacity: 0.3; cursor: default; }
  .pag-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── Modal ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    z-index: 200; align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    width: 480px; max-width: 95vw;
    padding: 1.5rem;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-12px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close {
    width: 28px; height: 28px; border-radius: 7px;
    border: 1px solid var(--border2); background: transparent;
    color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .modal-close:hover { background: var(--surface2); color: var(--text); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .form-group input, .form-group select {
    padding: 8px 11px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text); font-family: inherit; font-size: 14px;
    outline: none; transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group select option { background: var(--surface2); }

  .modal-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 1.25rem; padding-top: 1.25rem;
    border-top: 1px solid var(--border);
  }

  /* Delete confirm */
  .del-body { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 1rem; }
  .del-body strong { color: var(--text); }
  .btn-danger { background: var(--red); color: #fff; border-color: transparent; }
  .btn-danger:hover { background: #f77090; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2); border: 1px solid var(--border2);
    color: var(--text); padding: 10px 18px;
    border-radius: var(--radius); font-size: 13px;
    display: flex; align-items: center; gap: 8px;
    z-index: 300; opacity: 0; transform: translateY(8px);
    transition: all 0.25s; pointer-events: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show { opacity: 1; transform: none; }
  .toast-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .toast-dot.red { background: var(--red); }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
</style>
</head>
<body>


<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Stock Management</h1>
      <p>Full inventory control — view, edit, update & delete</p>
    </div>
    <div class="topbar-right">
      <button class="btn" onclick="exportCSV()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
        Export CSV
      </button>
      <button class="btn btn-primary" onclick="openAdd()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        Add Stock
      </button>
    </div>
  </div>

  <div class="content">
    <!-- Stats -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Search by name or SKU…" oninput="render()">
        </div>
        <select class="filter" id="catFilter" onchange="render()">
          <option value="">All categories</option>
          <option>Electronics</option>
          <option>Accessories</option>
          <option>Peripherals</option>
          <option>Storage</option>
        </select>
        <select class="filter" id="statusFilter" onchange="render()">
          <option value="">All statuses</option>
          <option value="critical">Critical (out of stock)</option>
          <option value="warning">Warning (low stock)</option>
          <option value="ok">Healthy</option>
        </select>
        <select class="filter" id="perPage" onchange="perPageChange()">
          <option value="8">8 per page</option>
          <option value="15">15 per page</option>
          <option value="30">30 per page</option>
        </select>
      </div>

      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('sku')">SKU <span class="sort-icon" id="s-sku">↕</span></th>
              <th onclick="sortBy('name')">Product <span class="sort-icon" id="s-name">↕</span></th>
              <th onclick="sortBy('category')">Category <span class="sort-icon" id="s-category">↕</span></th>
              <th onclick="sortBy('qty')">Qty <span class="sort-icon" id="s-qty">↕</span></th>
              <th onclick="sortBy('min')">Min <span class="sort-icon" id="s-min">↕</span></th>
              <th onclick="sortBy('price')">Price <span class="sort-icon" id="s-price">↕</span></th>
              <th onclick="sortBy('lastSold')">Last Sold <span class="sort-icon" id="s-lastSold">↕</span></th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="pagination">
        <span id="pagInfo"></span>
        <div class="pag-btns" id="pagBtns"></div>
      </div>
    </div>
  </div>
</div>

<!-- Edit/Add Modal -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Add stock item</span>
      <button class="modal-close" onclick="closeModals()">×</button>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>SKU *</label><input id="fSku" type="text" placeholder="e.g. SKU-001"></div>
      <div class="form-group"><label>Category</label>
        <select id="fCat">
          <option>Electronics</option>
          <option>Accessories</option>
          <option>Peripherals</option>
          <option>Storage</option>
        </select>
      </div>
      <div class="form-group full"><label>Product name *</label><input id="fName" type="text" placeholder="e.g. Bluetooth Headphones Pro"></div>
      <div class="form-group"><label>Quantity</label><input id="fQty" type="number" min="0" value="0"></div>
      <div class="form-group"><label>Min threshold</label><input id="fMin" type="number" min="0" value="5"></div>
      <div class="form-group"><label>Price (₹)</label><input id="fPrice" type="number" min="0" step="0.01" value="0"></div>
      <div class="form-group"><label>Last sold</label><input id="fLastSold" type="text" placeholder="e.g. Today, Yesterday"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModals()">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem()">Save item</button>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="overlay" id="delOverlay">
  <div class="modal" style="width:400px">
    <div class="modal-header">
      <span class="modal-title">Delete item</span>
      <button class="modal-close" onclick="closeModals()">×</button>
    </div>
    <p class="del-body">Are you sure you want to permanently delete <strong id="delName"></strong>? This action cannot be undone.</p>
    <div class="modal-footer">
      <button class="btn" onclick="closeModals()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Delete item</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"><span class="toast-dot" id="toastDot"></span><span id="toastMsg"></span></div>

<script>
let stock = [
  {id:1,sku:'BHP-204',name:'Bluetooth Headphones Pro',category:'Electronics',qty:0,min:10,price:3499,lastSold:'Today'},
  {id:2,sku:'UCH-117',name:'USB-C Hub 7-in-1',category:'Accessories',qty:2,min:10,price:1299,lastSold:'Yesterday'},
  {id:3,sku:'WBC-301',name:'4K Webcam Pro',category:'Electronics',qty:0,min:5,price:5999,lastSold:'3 days ago'},
  {id:4,sku:'WKM-089',name:'Wireless Keyboard MX',category:'Peripherals',qty:7,min:15,price:2199,lastSold:'Today'},
  {id:5,sku:'GMR-055',name:'Gaming Mouse RGB',category:'Peripherals',qty:9,min:20,price:1799,lastSold:'Today'},
  {id:6,sku:'LM24-031',name:'LED Monitor 24"',category:'Electronics',qty:4,min:8,price:12999,lastSold:'2 days ago'},
  {id:7,sku:'AAB-012',name:'AA Battery 8-pack',category:'Accessories',qty:12,min:50,price:299,lastSold:'Today'},
  {id:8,sku:'HDMI-3M',name:'HDMI Cable 3m',category:'Accessories',qty:6,min:25,price:499,lastSold:'Yesterday'},
  {id:9,sku:'SSD-512',name:'SSD 512GB',category:'Storage',qty:34,min:10,price:4499,lastSold:'Today'},
  {id:10,sku:'USB-FL',name:'USB Flash Drive 64GB',category:'Storage',qty:55,min:20,price:799,lastSold:'Yesterday'},
  {id:11,sku:'SPK-WR1',name:'Portable Bluetooth Speaker',category:'Electronics',qty:18,min:8,price:2899,lastSold:'3 days ago'},
  {id:12,sku:'MNT-ARM',name:'Dual Monitor Arm',category:'Accessories',qty:11,min:5,price:3199,lastSold:'4 days ago'},
  {id:13,sku:'NUM-PAD',name:'Wireless Numeric Keypad',category:'Peripherals',qty:22,min:10,price:899,lastSold:'Today'},
  {id:14,sku:'CAM-CV1',name:'Webcam Cover Slider',category:'Accessories',qty:80,min:30,price:149,lastSold:'Today'},
  {id:15,sku:'EXT-HUB',name:'USB 3.0 Hub 4-Port',category:'Accessories',qty:3,min:12,price:699,lastSold:'Yesterday'},
  {id:16,sku:'TYPE-C',name:'USB-C Charging Cable 2m',category:'Accessories',qty:45,min:20,price:349,lastSold:'Today'},
  {id:17,sku:'HDD-1TB',name:'External HDD 1TB',category:'Storage',qty:8,min:5,price:3999,lastSold:'2 days ago'},
  {id:18,sku:'PWR-20K',name:'Power Bank 20000mAh',category:'Electronics',qty:0,min:8,price:1999,lastSold:'5 days ago'},
];
let nextId = 19;
let page = 1;
let perPage = 8;
let sortKey = 'name';
let sortAsc = true;
let editId = null;
let delId = null;

function status(item) {
  if (item.qty === 0) return 'critical';
  if (item.qty < item.min) return 'warning';
  return 'ok';
}
function statusLabel(s) { return s === 'critical' ? 'Critical' : s === 'warning' ? 'Warning' : 'Healthy'; }

function filtered() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const st = document.getElementById('statusFilter').value;
  return stock.filter(i => {
    return (!q || i.name.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q))
      && (!cat || i.category === cat)
      && (!st || status(i) === st);
  }).sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    return sortAsc ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
  });
}

function renderStats() {
  const crit = stock.filter(i => status(i) === 'critical').length;
  const warn = stock.filter(i => status(i) === 'warning').length;
  const ok = stock.filter(i => status(i) === 'ok').length;
  const totalVal = stock.reduce((s, i) => s + i.qty * i.price, 0);
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card c-blue">
      <div class="stat-label">Total SKUs</div>
      <div class="stat-value">${stock.length}</div>
      <div class="stat-sub">Active items</div>
    </div>
    <div class="stat-card c-red">
      <div class="stat-label">Out of Stock</div>
      <div class="stat-value">${crit}</div>
      <div class="stat-sub">Critical — reorder now</div>
    </div>
    <div class="stat-card c-amber">
      <div class="stat-label">Low Stock</div>
      <div class="stat-value">${warn}</div>
      <div class="stat-sub">Below minimum threshold</div>
    </div>
    <div class="stat-card c-green">
      <div class="stat-label">Healthy Stock</div>
      <div class="stat-value">${ok}</div>
      <div class="stat-sub">${Math.round(ok/stock.length*100)}% of products</div>
    </div>
  `;
  const badge = document.getElementById('sideAlertBadge'); if (badge) badge.textContent = crit + warn;
}

function render() {
  renderStats();
  const data = filtered();
  const total = data.length;
  const totalPages = Math.max(1, Math.ceil(total / perPage));
  if (page > totalPages) page = totalPages;
  const slice = data.slice((page - 1) * perPage, page * perPage);

  document.getElementById('tbody').innerHTML = slice.map(item => {
    const s = status(item);
    const qcls = s === 'critical' ? 'qty-red' : s === 'warning' ? 'qty-amber' : 'qty-green';
    return `<tr>
      <td><span class="sku">${item.sku}</span></td>
      <td>
        <div class="product-name">${item.name}</div>
        <div class="product-cat">${item.category}</div>
      </td>
      <td style="color:var(--muted);font-size:13px">${item.category}</td>
      <td><span class="qty-val ${qcls}">${item.qty}</span></td>
      <td style="color:var(--muted)">${item.min}</td>
      <td class="price">₹${item.price.toLocaleString()}</td>
      <td style="color:var(--muted);font-size:12px">${item.lastSold}</td>
      <td><span class="badge badge-${s}">${statusLabel(s)}</span></td>
      <td>
        <div class="action-cell">
          <button class="icon-btn edit" title="Edit item" onclick="openEdit(${item.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn danger" title="Delete item" onclick="openDel(${item.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');

  const start = total === 0 ? 0 : (page - 1) * perPage + 1;
  const end = Math.min(page * perPage, total);
  document.getElementById('pagInfo').textContent = `Showing ${start}–${end} of ${total} items`;

  let btns = `<button class="pag-btn" onclick="gotoPage(${page-1})" ${page===1?'disabled':''}>← Prev</button>`;
  for (let p = 1; p <= totalPages; p++) {
    if (totalPages <= 7 || Math.abs(p - page) <= 2 || p === 1 || p === totalPages) {
      btns += `<button class="pag-btn${p===page?' active':''}" onclick="gotoPage(${p})">${p}</button>`;
    } else if (Math.abs(p - page) === 3) {
      btns += `<span style="padding:0 4px;color:var(--muted)">…</span>`;
    }
  }
  btns += `<button class="pag-btn" onclick="gotoPage(${page+1})" ${page===totalPages?'disabled':''}>Next →</button>`;
  document.getElementById('pagBtns').innerHTML = btns;

  // update sort icons
  ['sku','name','category','qty','min','price','lastSold'].forEach(k => {
    const el = document.getElementById('s-'+k);
    if (!el) return;
    el.parentElement.classList.toggle('active', sortKey === k);
    el.textContent = sortKey === k ? (sortAsc ? '↑' : '↓') : '↕';
  });
}

function sortBy(k) {
  if (sortKey === k) sortAsc = !sortAsc;
  else { sortKey = k; sortAsc = true; }
  page = 1; render();
}
function gotoPage(p) { page = p; render(); }
function perPageChange() {
  perPage = parseInt(document.getElementById('perPage').value);
  page = 1; render();
}

function openAdd() {
  editId = null;
  document.getElementById('modalTitle').textContent = 'Add stock item';
  document.getElementById('fSku').value = '';
  document.getElementById('fName').value = '';
  document.getElementById('fCat').value = 'Electronics';
  document.getElementById('fQty').value = '0';
  document.getElementById('fMin').value = '5';
  document.getElementById('fPrice').value = '0';
  document.getElementById('fLastSold').value = '';
  document.getElementById('editOverlay').classList.add('open');
}
function openEdit(id) {
  const item = stock.find(i => i.id === id); if (!item) return;
  editId = id;
  document.getElementById('modalTitle').textContent = 'Edit stock item';
  document.getElementById('fSku').value = item.sku;
  document.getElementById('fName').value = item.name;
  document.getElementById('fCat').value = item.category;
  document.getElementById('fQty').value = item.qty;
  document.getElementById('fMin').value = item.min;
  document.getElementById('fPrice').value = item.price;
  document.getElementById('fLastSold').value = item.lastSold || '';
  document.getElementById('editOverlay').classList.add('open');
}
function saveItem() {
  const sku = document.getElementById('fSku').value.trim();
  const name = document.getElementById('fName').value.trim();
  if (!sku || !name) { alert('SKU and Product name are required.'); return; }
  const payload = {
    sku, name,
    category: document.getElementById('fCat').value,
    qty: parseInt(document.getElementById('fQty').value) || 0,
    min: parseInt(document.getElementById('fMin').value) || 0,
    price: parseFloat(document.getElementById('fPrice').value) || 0,
    lastSold: document.getElementById('fLastSold').value.trim() || 'N/A'
  };
  if (editId === null) {
    stock.push({ id: nextId++, ...payload });
    toast('Item added successfully', false);
  } else {
    const idx = stock.findIndex(i => i.id === editId);
    if (idx > -1) stock[idx] = { ...stock[idx], ...payload };
    toast('Item updated', false);
  }
  closeModals(); render();
}
function openDel(id) {
  const item = stock.find(i => i.id === id); if (!item) return;
  delId = id;
  document.getElementById('delName').textContent = item.name;
  document.getElementById('delOverlay').classList.add('open');
}
function confirmDelete() {
  stock = stock.filter(i => i.id !== delId);
  toast('Item deleted', true);
  closeModals(); render();
}
function closeModals() {
  document.getElementById('editOverlay').classList.remove('open');
  document.getElementById('delOverlay').classList.remove('open');
}
function toast(msg, danger) {
  const t = document.getElementById('toast');
  const d = document.getElementById('toastDot');
  document.getElementById('toastMsg').textContent = msg;
  d.className = 'toast-dot' + (danger ? ' red' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}
function exportCSV() {
  const rows = [['SKU','Product','Category','Quantity','Min Threshold','Price (INR)','Last Sold','Status']];
  stock.forEach(i => rows.push([i.sku, i.name, i.category, i.qty, i.min, i.price, i.lastSold, status(i)]));
  const csv = rows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'stock-export.csv';
  a.click();
  toast('CSV exported', false);
}

// Close modals on overlay click
document.getElementById('editOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModals(); });
document.getElementById('delOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModals(); });

render();
</script>
</body>
</html>

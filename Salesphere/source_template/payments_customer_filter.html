
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,system-ui);font-size:13px;color:var(--color-text-primary);background:var(--color-background-primary)}
.wrap{padding:1rem 0}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sb{position:relative;flex:1;min-width:140px}
.sb i{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--color-text-secondary);pointer-events:none}
.sb input{width:100%;padding:6px 10px 6px 30px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px;outline:none}
.sb input:focus{border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,0.12);background:var(--color-background-primary)}
.sb input::placeholder{color:var(--color-text-secondary);opacity:0.7}

/* ── CUSTOMER DROPDOWN ── */
.cust-wrap{position:relative;flex-shrink:0}
.cust-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px;cursor:pointer;white-space:nowrap;min-width:148px;justify-content:space-between}
.cust-btn:hover{border-color:var(--color-border-secondary)}
.cust-btn.active{border-color:#378ADD;background:#E6F1FB;color:#0C447C}
.cust-btn .lft{display:flex;align-items:center;gap:5px;overflow:hidden}
.cust-btn .lft span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px}
.cust-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;width:240px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);z-index:100;overflow:hidden}
.cust-panel.open{display:block}
.cp-search{padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary)}
.cp-search input{width:100%;padding:5px 8px 5px 28px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px;outline:none}
.cp-search input:focus{border-color:#378ADD;background:var(--color-background-primary)}
.cp-search-wrap{position:relative}
.cp-search-wrap i{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--color-text-secondary);pointer-events:none}
.cp-list{max-height:200px;overflow-y:auto}
.cp-list::-webkit-scrollbar{width:4px}
.cp-list::-webkit-scrollbar-thumb{background:var(--color-border-secondary);border-radius:2px}
.cp-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:12px;color:var(--color-text-primary)}
.cp-item:hover{background:var(--color-background-secondary)}
.cp-item.selected{background:#E6F1FB;color:#0C447C}
.cp-item .av{width:24px;height:24px;border-radius:50%;background:#E6F1FB;color:#0C447C;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0}
.cp-item.selected .av{background:#B5D4F4;color:#042C53}
.cp-item .ci{flex:1;min-width:0}
.cp-item .cn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-item .ct{font-size:11px;color:var(--color-text-secondary)}
.cp-item.selected .ct{color:#185FA5}
.cp-item .ck{font-size:12px;color:#378ADD;flex-shrink:0}
.cp-none{padding:10px 12px;font-size:12px;color:var(--color-text-secondary);text-align:center}
.cp-footer{border-top:0.5px solid var(--color-border-tertiary);padding:6px 10px}
.cp-clear{font-size:11px;color:#378ADD;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.cp-clear:hover{text-decoration:underline}

/* ── ACTIVE FILTER CHIPS ── */
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-height:0}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;background:#E6F1FB;border:0.5px solid #B5D4F4;font-size:11px;color:#0C447C}
.fchip button{background:none;border:none;cursor:pointer;color:#378ADD;padding:0;line-height:1;display:flex;align-items:center;font-size:13px}
.fchip button:hover{color:#0C447C}

select.flt{padding:5px 8px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px;outline:none;cursor:pointer;flex-shrink:0}
select.flt:focus{border-color:#378ADD}

.tbl-outer{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead tr{background:var(--color-background-secondary)}
th{padding:8px 10px;text-align:left;font-size:10px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.6px;border-bottom:0.5px solid var(--color-border-tertiary);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--color-text-primary)}
th .si{margin-left:2px;opacity:0.4;font-size:9px}
tbody tr{border-bottom:0.5px solid var(--color-border-tertiary);transition:background 0.1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover td{background:var(--color-background-secondary)}
td{padding:9px 10px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-pill{font-family:var(--font-mono);font-size:11px;color:#0C447C;background:#E6F1FB;padding:2px 6px;border-radius:4px;border:0.5px solid #B5D4F4;display:inline-block}
.cname{font-weight:500;font-size:12px}
.ctype{font-size:10px;color:var(--color-text-secondary);margin-top:1px}
.mono{font-family:var(--font-mono);font-size:12px}
.red-mono{font-family:var(--font-mono);font-size:12px;color:#A32D2D}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500}
.badge::before{content:'';width:4px;height:4px;border-radius:50%;display:block;flex-shrink:0}
.b-paid{background:#EAF3DE;color:#27500A}.b-paid::before{background:#639922}
.b-partial{background:#FAEEDA;color:#633806}.b-partial::before{background:#BA7517}
.b-pending{background:#E6F1FB;color:#0C447C}.b-pending::before{background:#378ADD}
.b-overdue{background:#FCEBEB;color:#791F1F}.b-overdue::before{background:#E24B4A}
.prog-wrap{width:38px;height:3px;background:var(--color-border-tertiary);border-radius:2px;display:inline-block;vertical-align:middle;margin-left:4px}
.prog-bar{height:3px;border-radius:2px}
.due-ok{color:var(--color-text-secondary);font-size:11px}
.due-warn{color:#854F0B;font-size:11px;font-weight:500}
.due-over{color:#A32D2D;font-size:11px;font-weight:500}

/* ── COLLECT CELL ── */
.collect-cell{display:flex;flex-direction:column;gap:4px}
.collect-row1{display:flex;align-items:center;gap:4px}
.amt-inp{width:80px;padding:5px 7px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px;font-family:var(--font-mono);outline:none;text-align:right;flex-shrink:0}
.amt-inp:focus{border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,0.1);background:var(--color-background-primary)}
.amt-inp.is-full{border-color:#639922;background:#EAF3DE;color:#27500A}
.amt-inp.is-over{border-color:#E24B4A;background:#FCEBEB;color:#A32D2D}
.method-sel{padding:5px 5px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:11px;outline:none;flex-shrink:0;cursor:pointer;max-width:76px}
.cbtn{padding:5px 8px;border-radius:var(--border-radius-md);border:none;background:#378ADD;color:#fff;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:3px}
.cbtn:hover{background:#185FA5}
.cbtn:disabled{opacity:0.35;cursor:default}
.note-inp{width:100%;padding:3px 7px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:11px;outline:none;display:none}
.note-inp.show{display:block}
.note-inp:focus{border-color:#378ADD;background:var(--color-background-primary)}
.preview-tag{font-size:10px;font-weight:500;padding:2px 6px;border-radius:20px;white-space:nowrap;display:none;align-items:center;gap:2px;flex-shrink:0}
.preview-tag.show{display:inline-flex}
.preview-tag.sp-paid{background:#EAF3DE;color:#27500A}
.preview-tag.sp-partial{background:#FAEEDA;color:#633806}
.settled-cell{display:flex;align-items:center;gap:6px}
.settled-info{flex:1;min-width:0}
.settled-amt{font-family:var(--font-mono);font-size:12px;color:#27500A;font-weight:500}
.settled-meta{font-size:10px;color:var(--color-text-secondary);margin-top:1px;display:flex;gap:4px;align-items:center}
.method-tag{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:3px;padding:1px 5px;font-size:10px;color:var(--color-text-secondary)}
.act-btns{display:flex;gap:4px;flex-shrink:0}
.ibtn{width:26px;height:26px;border-radius:6px;border:0.5px solid var(--color-border-tertiary);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-secondary);transition:all 0.12s}
.ibtn i{font-size:13px}
.ibtn.iedit:hover{border-color:#B5D4F4;background:#E6F1FB;color:#0C447C}
.ibtn.iundo:hover{border-color:#F7C1C1;background:#FCEBEB;color:#A32D2D}
.closed-msg{font-size:11px;color:var(--color-text-secondary);display:flex;align-items:center;gap:4px}
.edit-cell{display:flex;flex-direction:column;gap:4px}
.edit-row1{display:flex;align-items:center;gap:4px}
.edit-inp{width:80px;padding:5px 7px;border:1.5px solid #378ADD;border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:12px;font-family:var(--font-mono);outline:none;text-align:right;box-shadow:0 0 0 2px rgba(55,138,221,0.1)}
.edit-method{padding:5px 5px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:11px;outline:none;cursor:pointer;max-width:76px}
.save-btn{padding:5px 8px;border-radius:var(--border-radius-md);border:none;background:#378ADD;color:#fff;font-size:11px;font-weight:500;cursor:pointer}
.save-btn:hover{background:#185FA5}
.cancel-btn{padding:5px 7px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:transparent;color:var(--color-text-secondary);font-size:11px;cursor:pointer}
.cancel-btn:hover{background:var(--color-background-secondary)}
.edit-note{width:100%;padding:3px 7px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:11px;outline:none}
.edit-note:focus{border-color:#378ADD;background:var(--color-background-primary)}
.footer{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);font-size:11px;color:var(--color-text-secondary)}
.pag{display:flex;gap:3px}
.pb{min-width:26px;height:26px;padding:0 5px;border-radius:6px;border:0.5px solid var(--color-border-tertiary);background:transparent;color:var(--color-text-primary);font-size:11px;cursor:pointer}
.pb:hover:not(:disabled):not(.active){background:var(--color-background-secondary)}
.pb:disabled{opacity:0.35;cursor:default}
.pb.active{background:#378ADD;border-color:#378ADD;color:#fff}
.empty-row td{text-align:center;padding:28px;color:var(--color-text-secondary);font-size:12px}
</style>

<h2 class="sr-only">Payments table with customer name filter for SaleSphere</h2>
<div class="wrap">

  <div class="toolbar">
    <div class="sb">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" id="srch" placeholder="Search invoice…" oninput="render()">
    </div>

    <div class="cust-wrap" id="custWrap">
      <button class="cust-btn" id="custBtn" onclick="togglePanel()" aria-haspopup="listbox" aria-expanded="false">
        <span class="lft">
          <i class="ti ti-user" style="font-size:13px;flex-shrink:0" aria-hidden="true"></i>
          <span id="custBtnLabel">All customers</span>
        </span>
        <i class="ti ti-chevron-down" style="font-size:12px;flex-shrink:0" aria-hidden="true"></i>
      </button>
      <div class="cust-panel" id="custPanel" role="listbox" aria-label="Filter by customer">
        <div class="cp-search">
          <div class="cp-search-wrap">
            <i class="ti ti-search" aria-hidden="true"></i>
            <input type="text" id="cpSearch" placeholder="Search customers…" oninput="filterCpList()" autocomplete="off">
          </div>
        </div>
        <div class="cp-list" id="cpList"></div>
        <div class="cp-footer">
          <button class="cp-clear" onclick="clearCust()">Clear filter</button>
        </div>
      </div>
    </div>

    <select class="flt" id="sflt" onchange="render()">
      <option value="">All statuses</option>
      <option value="Pending">Pending</option>
      <option value="Partial">Partial</option>
      <option value="Overdue">Overdue</option>
      <option value="Paid">Paid</option>
    </select>
    <select class="flt" id="ppflt" onchange="ppCh()">
      <option value="6">6 / page</option>
      <option value="10">10 / page</option>
    </select>
  </div>

  <div id="chips" class="filter-chips"></div>

  <div class="tbl-outer">
    <table>
      <thead><tr>
        <th style="width:96px" onclick="srt('inv')">Invoice <span class="si" id="ss-inv">↕</span></th>
        <th style="width:140px" onclick="srt('cust')">Customer <span class="si" id="ss-cust">↕</span></th>
        <th style="width:74px" onclick="srt('due')">Due <span class="si" id="ss-due">↕</span></th>
        <th style="width:88px" onclick="srt('total')">Total <span class="si" id="ss-total">↕</span></th>
        <th style="width:84px" onclick="srt('bal')">Balance <span class="si" id="ss-bal">↕</span></th>
        <th style="width:70px">Status</th>
        <th>Collect payment</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="footer">
      <span id="pgInfo"></span>
      <div class="pag" id="pagDiv"></div>
    </div>
  </div>
</div>

<script>
const today = new Date('2026-05-27');
const METHODS = ['Cash','UPI','Card','Bank transfer','Cheque'];

let data = [
  {id:1, inv:'#SS-1031', cust:'Ravi Kumar',         type:'Retail',    due:'2026-05-20', total:5000,  paid:0,     settled:null, settledMethod:'Cash',          settledNote:'', editing:false},
  {id:2, inv:'#SS-1030', cust:'Meena Textiles',      type:'Business',  due:'2026-05-15', total:8750,  paid:3500,  settled:null, settledMethod:'UPI',           settledNote:'', editing:false},
  {id:3, inv:'#SS-1029', cust:'Anand Stores',        type:'Wholesale', due:'2026-06-01', total:560,   paid:560,   settled:null, settledMethod:'Cash',          settledNote:'', editing:false},
  {id:4, inv:'#SS-1028', cust:'Kavitha Electronics', type:'Business',  due:'2026-04-30', total:12400, paid:5000,  settled:null, settledMethod:'Bank transfer', settledNote:'', editing:false},
  {id:5, inv:'#SS-1027', cust:'Selvam Traders',      type:'Wholesale', due:'2026-04-25', total:1890,  paid:0,     settled:null, settledMethod:'Cash',          settledNote:'', editing:false},
  {id:6, inv:'#SS-1026', cust:'Priya Fashions',      type:'Retail',    due:'2026-05-28', total:3200,  paid:1600,  settled:null, settledMethod:'Card',          settledNote:'', editing:false},
  {id:7, inv:'#SS-1025', cust:'Kumar Hardware',      type:'Business',  due:'2026-05-10', total:7450,  paid:0,     settled:null, settledMethod:'Cheque',        settledNote:'', editing:false},
  {id:8, inv:'#SS-1024', cust:'Nair Distributors',   type:'Wholesale', due:'2026-06-05', total:15200, paid:15200, settled:null, settledMethod:'UPI',           settledNote:'', editing:false},
  {id:9, inv:'#SS-1023', cust:'Lakshmi Stores',      type:'Retail',    due:'2026-04-18', total:920,   paid:0,     settled:null, settledMethod:'Cash',          settledNote:'', editing:false},
  {id:10,inv:'#SS-1022', cust:'Sri Balaji Traders',  type:'Business',  due:'2026-05-30', total:4600,  paid:2000,  settled:null, settledMethod:'UPI',           settledNote:'', editing:false},
];

const customers = [...new Map(data.map(d => [d.cust, {name:d.cust, type:d.type}])).values()];

let selectedCust = '';
let sk='due', sa=true, pg=1, pp=6;

function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function calcStatus(inv){
  if(inv.paid>=inv.total) return 'Paid';
  if(inv.paid>0) return 'Partial';
  if(new Date(inv.due)<today) return 'Overdue';
  return 'Pending';
}
function dueLabel(dueStr){
  const d=new Date(dueStr), diff=Math.round((d-today)/86400000);
  if(diff<0) return {txt:Math.abs(diff)+'d overdue',cls:'due-over'};
  if(diff===0) return {txt:'Due today',cls:'due-warn'};
  if(diff<=7) return {txt:'In '+diff+'d',cls:'due-warn'};
  return {txt:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}),cls:'due-ok'};
}
function fmt(n){return '₹'+Math.round(n).toLocaleString('en-IN')}
function badgeCls(s){return s==='Paid'?'b-paid':s==='Partial'?'b-partial':s==='Overdue'?'b-overdue':'b-pending'}
function methodOptions(sel){return METHODS.map(m=>`<option value="${m}"${m===sel?' selected':''}>${m}</option>`).join('')}
function methodIcon(m){return m==='Cash'?'cash':m==='UPI'?'device-mobile':m==='Card'?'credit-card':m==='Bank transfer'?'building-bank':'receipt-2'}

function buildCpList(){
  const q=(document.getElementById('cpSearch').value||'').toLowerCase();
  const custs = q ? customers.filter(c=>c.name.toLowerCase().includes(q)) : customers;
  const el = document.getElementById('cpList');
  if(!custs.length){
    el.innerHTML=`<div class="cp-none">No customers found</div>`;
    return;
  }
  el.innerHTML = custs.map(c=>`
    <div class="cp-item${selectedCust===c.name?' selected':''}" onclick="selectCust('${c.name.replace(/'/,"\\'")}')">
      <div class="av">${initials(c.name)}</div>
      <div class="ci">
        <div class="cn">${c.name}</div>
        <div class="ct">${c.type}</div>
      </div>
      ${selectedCust===c.name?'<i class="ck ti ti-check"></i>':''}
    </div>`).join('');
}

function filterCpList(){ buildCpList(); }

function togglePanel(){
  const panel=document.getElementById('custPanel');
  const btn=document.getElementById('custBtn');
  const open=panel.classList.toggle('open');
  btn.setAttribute('aria-expanded', open);
  if(open){ buildCpList(); setTimeout(()=>document.getElementById('cpSearch').focus(),50); }
}

function selectCust(name){
  selectedCust = selectedCust===name ? '' : name;
  updateCustBtn();
  buildCpList();
  pg=1; render(); renderChips();
}

function clearCust(){
  selectedCust='';
  document.getElementById('cpSearch').value='';
  updateCustBtn();
  buildCpList();
  pg=1; render(); renderChips();
  document.getElementById('custPanel').classList.remove('open');
  document.getElementById('custBtn').setAttribute('aria-expanded','false');
}

function updateCustBtn(){
  const lbl=document.getElementById('custBtnLabel');
  const btn=document.getElementById('custBtn');
  lbl.textContent = selectedCust || 'All customers';
  btn.classList.toggle('active', !!selectedCust);
}

function renderChips(){
  const chips=document.getElementById('chips');
  let html='';
  if(selectedCust) html+=`<span class="fchip"><i class="ti ti-user" style="font-size:11px" aria-hidden="true"></i>${selectedCust}<button onclick="clearCust()" aria-label="Remove customer filter"><i class="ti ti-x" style="font-size:11px"></i></button></span>`;
  const sf=document.getElementById('sflt').value;
  if(sf) html+=`<span class="fchip">${sf}<button onclick="document.getElementById('sflt').value='';render();renderChips()" aria-label="Remove status filter"><i class="ti ti-x" style="font-size:11px"></i></button></span>`;
  chips.innerHTML=html;
  chips.style.display=html?'flex':'none';
}

document.addEventListener('click',function(e){
  const wrap=document.getElementById('custWrap');
  if(!wrap.contains(e.target)){
    document.getElementById('custPanel').classList.remove('open');
    document.getElementById('custBtn').setAttribute('aria-expanded','false');
  }
});

function filtered(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const sf=document.getElementById('sflt').value;
  return data.filter(i=>
    (!q || i.inv.toLowerCase().includes(q) || i.cust.toLowerCase().includes(q)) &&
    (!selectedCust || i.cust===selectedCust) &&
    (!sf || calcStatus(i)===sf)
  ).sort((a,b)=>{
    let va,vb;
    if(sk==='bal'){va=a.total-a.paid;vb=b.total-b.paid;}
    else if(sk==='due'){va=a.due;vb=b.due;}
    else if(sk==='total'){va=a.total;vb=b.total;}
    else{va=a[sk==='inv'?'inv':'cust'];vb=b[sk==='inv'?'inv':'cust'];}
    if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}
    return sa?(va>vb?1:-1):(va<vb?1:-1);
  });
}

function collectCell(inv){
  const s=calcStatus(inv), bal=inv.total-inv.paid;
  if(s==='Paid') return `<td><span class="closed-msg"><i class="ti ti-circle-check" style="font-size:14px;color:#3B6D11" aria-hidden="true"></i> Closed</span></td>`;
  if(inv.settled!==null && !inv.editing){
    return `<td><div class="settled-cell">
      <i class="ti ti-circle-check" style="font-size:15px;color:#3B6D11;flex-shrink:0" aria-hidden="true"></i>
      <div class="settled-info">
        <div class="settled-amt">${fmt(inv.settled)} collected</div>
        <div class="settled-meta"><span class="method-tag"><i class="ti ti-${methodIcon(inv.settledMethod)}" style="font-size:11px;margin-right:2px" aria-hidden="true"></i>${inv.settledMethod}</span>${inv.settledNote?`<span style="font-size:10px;overflow:hidden;text-overflow:ellipsis;max-width:72px" title="${inv.settledNote}">${inv.settledNote}</span>`:''}</div>
      </div>
      <div class="act-btns">
        <button class="ibtn iedit" title="Edit" aria-label="Edit settlement" onclick="startEdit(${inv.id})"><i class="ti ti-edit"></i></button>
        <button class="ibtn iundo" title="Undo" aria-label="Undo settlement" onclick="undoSettle(${inv.id})"><i class="ti ti-arrow-back-up"></i></button>
      </div>
    </div></td>`;
  }
  if(inv.editing){
    return `<td><div class="edit-cell">
      <div class="edit-row1">
        <input class="edit-inp" type="number" id="edit-${inv.id}" value="${inv.settled||''}" min="1" max="${inv.total}" step="1" placeholder="${Math.round(bal)}" onkeydown="if(event.key==='Enter')saveEdit(${inv.id},${inv.total})">
        <select class="edit-method" id="emethod-${inv.id}">${methodOptions(inv.settledMethod)}</select>
        <button class="save-btn" onclick="saveEdit(${inv.id},${inv.total})">Save</button>
        <button class="cancel-btn" onclick="cancelEdit(${inv.id})">Cancel</button>
      </div>
      <input class="edit-note" type="text" id="enote-${inv.id}" value="${inv.settledNote||''}" placeholder="Note (optional)…" maxlength="60">
    </div></td>`;
  }
  return `<td><div class="collect-cell">
    <div class="collect-row1">
      <input class="amt-inp" type="number" id="amt-${inv.id}" placeholder="${Math.round(bal)}" min="1" max="${bal}" step="1"
        oninput="onAmt(${inv.id},${bal})" onkeydown="if(event.key==='Enter')doSettle(${inv.id},${bal})" aria-label="Amount to collect">
      <select class="method-sel" id="method-${inv.id}" aria-label="Payment method">${methodOptions('Cash')}</select>
      <span class="preview-tag" id="sprev-${inv.id}"></span>
      <button class="cbtn" id="cbtn-${inv.id}" onclick="doSettle(${inv.id},${bal})" disabled aria-label="Confirm payment">
        <i class="ti ti-check" style="font-size:12px" aria-hidden="true"></i> Confirm
      </button>
    </div>
    <input class="note-inp" type="text" id="note-${inv.id}" placeholder="Note (optional)…" maxlength="60" aria-label="Payment note"
      onfocus="this.classList.add('show')" onblur="if(!this.value)this.classList.remove('show')">
  </div></td>`;
}

function render(){
  renderChips();
  const list=filtered(), total=list.length;
  const pages=Math.max(1,Math.ceil(total/pp));
  if(pg>pages) pg=pages;
  const slice=list.slice((pg-1)*pp,pg*pp);

  if(!slice.length){
    document.getElementById('tbody').innerHTML=`<tr class="empty-row"><td colspan="7"><i class="ti ti-search" style="font-size:18px;display:block;margin:0 auto 6px;color:var(--color-text-secondary)" aria-hidden="true"></i>No invoices match the current filters</td></tr>`;
  } else {
    document.getElementById('tbody').innerHTML=slice.map(inv=>{
      const s=calcStatus(inv), bal=inv.total-inv.paid;
      const pct=Math.round((inv.paid/inv.total)*100);
      const barColor=pct===100?'#639922':pct>0?'#BA7517':'#B5D4F4';
      const dl=dueLabel(inv.due);
      return `<tr id="tr-${inv.id}">
        <td><span class="inv-pill">${inv.inv}</span></td>
        <td>
          <div style="display:flex;align-items:center;gap:7px">
            <div style="width:22px;height:22px;border-radius:50%;background:#E6F1FB;color:#0C447C;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;flex-shrink:0">${initials(inv.cust)}</div>
            <div><div class="cname">${inv.cust}</div><div class="ctype">${inv.type}</div></div>
          </div>
        </td>
        <td><span class="${dl.cls}">${dl.txt}</span></td>
        <td><span class="mono">${fmt(inv.total)}<span class="prog-wrap"><span class="prog-bar" style="width:${pct}%;background:${barColor}"></span></span></span></td>
        <td><span class="${bal>0&&s!=='Paid'?'red-mono':'mono'}">${fmt(bal)}</span></td>
        <td><span class="badge ${badgeCls(s)}">${s}</span></td>
        ${collectCell(inv)}
      </tr>`;
    }).join('');
  }

  const start=total===0?0:(pg-1)*pp+1;
  document.getElementById('pgInfo').textContent=`Showing ${start}–${Math.min(pg*pp,total)} of ${total}`;
  let btns=`<button class="pb" onclick="gp(${pg-1})" ${pg===1?'disabled':''}>‹</button>`;
  for(let p=1;p<=pages;p++) btns+=`<button class="pb${p===pg?' active':''}" onclick="gp(${p})">${p}</button>`;
  btns+=`<button class="pb" onclick="gp(${pg+1})" ${pg===pages?'disabled':''}>›</button>`;
  document.getElementById('pagDiv').innerHTML=btns;
  ['inv','cust','due','total','bal'].forEach(k=>{
    const el=document.getElementById('ss-'+k);
    if(el) el.textContent=sk===k?(sa?'↑':'↓'):'↕';
  });
}

function onAmt(id,bal){
  const inp=document.getElementById('amt-'+id);
  const btn=document.getElementById('cbtn-'+id);
  const sp=document.getElementById('sprev-'+id);
  const val=parseFloat(inp.value)||0;
  inp.className='amt-inp'; sp.className='preview-tag'; sp.textContent=''; btn.disabled=true;
  if(val<=0||val>bal){if(val>bal)inp.className='amt-inp is-over';return;}
  btn.disabled=false;
  if(val===bal){inp.className='amt-inp is-full';sp.className='preview-tag show sp-paid';sp.innerHTML='<i class="ti ti-check" style="font-size:11px" aria-hidden="true"></i> Full';}
  else{sp.className='preview-tag show sp-partial';sp.textContent='Partial';}
  document.getElementById('note-'+id)?.classList.add('show');
}
function doSettle(id,bal){
  const inp=document.getElementById('amt-'+id);
  const val=parseFloat(inp.value)||0;
  if(val<=0||val>bal) return;
  const inv=data.find(i=>i.id===id); if(!inv) return;
  inv.paid=Math.min(inv.paid+val,inv.total);
  inv.settled=val;
  inv.settledMethod=document.getElementById('method-'+id)?.value||'Cash';
  inv.settledNote=document.getElementById('note-'+id)?.value||'';
  inv.editing=false;
  render();
}
function startEdit(id){
  data.forEach(i=>{if(i.id!==id)i.editing=false;});
  const inv=data.find(i=>i.id===id); if(!inv) return;
  inv.editing=true; render();
  setTimeout(()=>{const el=document.getElementById('edit-'+id);if(el){el.focus();el.select();}},30);
}
function saveEdit(id,total){
  const inp=document.getElementById('edit-'+id);
  const newVal=parseFloat(inp.value)||0;
  const inv=data.find(i=>i.id===id); if(!inv) return;
  if(newVal<=0||newVal>total){inp.style.borderColor='#E24B4A';return;}
  inv.paid=Math.min(inv.paid-(inv.settled||0)+newVal,total);
  inv.settled=newVal;
  inv.settledMethod=document.getElementById('emethod-'+id)?.value||inv.settledMethod;
  inv.settledNote=document.getElementById('enote-'+id)?.value||'';
  inv.editing=false; render();
}
function cancelEdit(id){const inv=data.find(i=>i.id===id);if(inv){inv.editing=false;render();}}
function undoSettle(id){
  const inv=data.find(i=>i.id===id);if(!inv)return;
  inv.paid=Math.max(0,inv.paid-(inv.settled||0));
  inv.settled=null;inv.settledNote='';inv.editing=false;render();
}
function srt(k){if(sk===k)sa=!sa;else{sk=k;sa=true;}pg=1;render();}
function gp(p){pg=p;render();}
function ppCh(){pp=parseInt(document.getElementById('ppflt').value);pg=1;render();}
render();
</script>
